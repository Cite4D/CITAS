# ==============================================================================
# Nginx Configuration for CITAS 2027 Conference Portal on Debian
# Copy this file to: /etc/nginx/sites-available/citas
# Enable with: sudo ln -s /etc/nginx/sites-available/citas /etc/nginx/sites-enabled/
# Then reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Option A: When hosted under subfolder: cite4d.com/citas
# Add this block inside your existing server block for cite4d.com:
#
# server {
#     server_name cite4d.com www.cite4d.com;
#     ...
#
#     location /citas/ {
#         alias /var/www/citas/dist/;
#         index index.html;
#         try_files $uri $uri/ /citas/index.html;
#
#         # Cache static assets
#         location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
#             expires 30d;
#             add_header Cache-Control "public, no-transform";
#         }
#     }
# }

# Option B: Standalone virtual host or Reverse Proxy for Vite preview server (port 4173)
server {
    listen 80;
    server_name cite4d.com www.cite4d.com;

    # Static file serving directly from dist folder (Fastest & Lightest)
    root /var/www/citas/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
